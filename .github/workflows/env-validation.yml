name: Environment Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Razify Binary
        run: go build -o /tmp/razify main.go

      - name: Validate Demo Environment Template
        run: /tmp/razify validate demo.env.example .env.example --json